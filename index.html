<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Python</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #101827; color: #f3f4f6; padding: 1rem; }
    main { width: min(100%, 25rem); background: #1f2937; padding: 1.25rem;
      border-radius: 1rem; box-shadow: 0 1rem 3rem #0005; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    #display { width: 100%; border: 0; border-radius: .6rem; background: #111827;
      color: #fff; font-size: 2rem; padding: .8rem; text-align: right; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem;
      margin-top: .8rem; }
    button { border: 0; border-radius: .6rem; padding: 1rem; font-size: 1.1rem;
      background: #374151; color: #fff; cursor: pointer; }
    button:hover, button:focus-visible { background: #4b5563; outline: 2px solid #60a5fa; }
    .operator, .equals { background: #2563eb; }
    .clear { background: #b91c1c; }
    .wide { grid-column: span 2; }
    #message { min-height: 1.4em; color: #fca5a5; margin: .8rem 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora Python</h1>
    <input id="display" aria-label="Expressão" value="" readonly>
    <div class="keys">
      <button class="clear" data-key="clear">C</button>
      <button data-key="(">(</button>
      <button data-key=")">)</button>
      <button class="operator" data-key="/">÷</button>
      <button data-key="7">7</button><button data-key="8">8</button>
      <button data-key="9">9</button><button class="operator" data-key="*">×</button>
      <button data-key="4">4</button><button data-key="5">5</button>
      <button data-key="6">6</button><button class="operator" data-key="-">−</button>
      <button data-key="1">1</button><button data-key="2">2</button>
      <button data-key="3">3</button><button class="operator" data-key="+">+</button>
      <button class="wide" data-key="0">0</button><button data-key=".">.</button>
      <button class="equals" data-key="=">=</button>
    </div>
    <p id="message" role="status"></p>
  </main>
  <script>
    const display = document.querySelector("#display");
    const message = document.querySelector("#message");
    async function calculate() {
      if (!display.value.trim()) return;
      message.textContent = "";
      try {
        const response = await fetch("/calculate", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({expression: display.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Erro no cálculo.");
        display.value = data.result;
      } catch (error) { message.textContent = error.message; }
    }
    function press(key) {
      if (key === "clear") display.value = "";
      else if (key === "=") calculate();
      else display.value += key;
    }
    document.querySelectorAll("button").forEach(button =>
      button.addEventListener("click", () => press(button.dataset.key)));
    document.addEventListener("keydown", event => {
      if (event.key === "Enter") press("=");
      else if (event.key === "Escape") press("clear");
      else if ("0123456789.+-*/()%".includes(event.key)) press(event.key);
    });
  </script>
</body>
</html>
